kind: RoleBinding

apiVersion: rbac.authorization.k8s.io/v1


metadata:
  name: frontend-deployment-binding
  namespace: dev-track

spec:

  subject:
    - kind: ServiceAccount
      name: cronjob-sa
      namespace: dev-track

  roleRef:
      kind: Role
      name: restart-deployment-role
      apiGroup: rbac.authorization.k8s.io  
