kind: CronJob

apiVerion: batch/v1

metadata:
  name: pod-restart-cron
  namespace: dev-track


spec:
  
  schedule: "0/30 * * * *"
  
  jobTemplate:
    
    spec:
       
      template:
         metadata:
           name: pod-restart
           labels:
             app: frontend

           spec:
             
             serviceAccountname: cronjob-sa
             restartPolicy: Never

             containers:
               - name: restart-container
                 image: bitnami/kubectl:latest
                 command:
                   - kubectl
                   - rollout
                   - restart
                   - deployment/frontend-dev-deploy
                   - -n
                   - dev-track  
