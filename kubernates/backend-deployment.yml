kind: Deployment

apiVersion: apps/v1

metadata:
  name: backend-dev-deploy
  namespace: dev-track

spec:
  
  replica: 2
  selector:
    matchLabel:
      app: backend

   template:

     metadata:
       label:
         app: backend

      spec:

        containers:
          - name: backend-container
            image: arbajmangaonkar/tracker_app-backend:latest
            ports:
              - containerPort: 5000


            

